<html lang="ru">

<title>RNZN — Legal</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1a1a1a;--muted:#555;--accent:#6f9908;--rule:#e3e3e3}

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

a{color:var(--accent)}

.nav{font-size:.9rem;margin-bottom:2.5em}
.nav a{margin-right:16px}
code{background:rgba(127,127,127,.14);padding:1px 5px;border-radius:5px;font-size:.92em}
ul{padding-left:1.3em}
footer{max-width:760px;margin:0 auto;padding:0 22px 40px;color:var(--muted);font-size:.85rem}
